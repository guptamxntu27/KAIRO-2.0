{% extends 'base.html' %}
{% block title %}Admin Login - KAIRO{% endblock %}

{% block content %}
<style>
    .login-box { max-width: 400px; margin: 40px auto; background: #181922; padding: 30px; border-radius: 8px; border-top: 4px solid #e50914; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #ccc; }
    .form-group input { width: 100%; padding: 10px; background: #0f1015; border: 1px solid #333; color: white; border-radius: 4px; }
</style>

<div class="login-box">
    <h2 style="text-align: center; margin-bottom: 20px;">Admin Login</h2>
    <form action="/admin/login" method="POST">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Login</button>
    </form>
</div>
{% endblock %}
